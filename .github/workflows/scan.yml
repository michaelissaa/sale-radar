name: Scan retailers and deploy dashboard

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (UTC); off the hour to avoid GitHub's busy :00 slot
  workflow_dispatch: # "Run workflow" button = manual scan now
    inputs:
      only:
        description: "Optional comma-separated brand ids to scan (blank = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["web/**", "config/**", "data/research.json", "scanner/**", "notify/**", ".github/workflows/scan.yml"]

permissions:
  contents: write # commit refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: scan-and-deploy
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (scanner)
        run: python -m unittest discover -s scanner -v
      - name: Scan retailers
        # push events only rebuild the site; scheduled/manual runs scan
        if: github.event_name != 'push'
        env:
          ONLY: ${{ inputs.only }}
        run: python scanner/scan.py ${ONLY:+--only "$ONLY"}
      - name: Send email alerts
        if: github.event_name != 'push'
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: python scanner/notify.py
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "sale-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm test
          node --test ../notify/apps-script/code.test.mjs
          npm run build
          test -s dist/data/dashboard.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
